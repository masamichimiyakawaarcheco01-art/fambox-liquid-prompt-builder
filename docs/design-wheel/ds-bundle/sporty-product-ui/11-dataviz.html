<!-- @dsCard group="Components · sporty-product-UI" name="Data viz (signature)" -->
<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0C0B;--surface:#14171A;--surface-2:#1C2024;--line:#272C30;--ink:#FFFFFF;--muted:#8C949C;--accent:#C6FF3A}
  *{margin:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:var(--bg);padding:24px;color:var(--ink)}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;font-family:'Space Grotesk'}
  .grotesk{font-family:'Space Grotesk'}
  .device{background:linear-gradient(160deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:24px;padding:24px;max-width:420px}
  .ring-wrap{display:flex;align-items:center;gap:20px}
  .ring{position:relative;width:120px;height:120px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-family:'Space Grotesk';font-size:28px;font-weight:700;line-height:1}
  .ring .pct span{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
  .meta .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .meta .big{font-family:'Space Grotesk';font-size:24px;font-weight:700;margin:2px 0 10px}
  .meta .big span{font-size:13px;color:var(--muted)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted)}
  .chip.on{background:var(--accent);color:#0A0C0B;border-color:var(--accent)}
  .bars{display:flex;align-items:flex-end;gap:8px;height:84px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
  .b{flex:1;background:#363D44;border-radius:6px 6px 0 0}
  .b.hot{background:var(--accent)}
  .rule{font-size:10px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
  .rule b{color:var(--accent);font-family:'Space Grotesk'}
</style></head>
<body>
  <h2>sporty / product-UI — Data viz（signature UI）</h2>
  <div class="device">
    <div class="ring-wrap">
      <div class="ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#272C30" stroke-width="11"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="#C6FF3A" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="68"/>
        </svg>
        <div class="pct"><b class="grotesk">79%</b><span>goal</span></div>
      </div>
      <div class="meta">
        <div class="l">Today</div>
        <div class="big grotesk">1,240 <span>kcal</span></div>
        <div class="chips"><span class="chip on">Strength</span><span class="chip">Cardio</span><span class="chip">Mobility</span></div>
      </div>
    </div>
    <div class="bars">
      <div class="b" style="height:40%"></div><div class="b" style="height:62%"></div>
      <div class="b" style="height:48%"></div><div class="b hot" style="height:88%"></div>
      <div class="b" style="height:55%"></div><div class="b" style="height:70%"></div>
      <div class="b" style="height:35%"></div>
    </div>
  </div>
  <div class="rule">
    規律: <b>データ可視化を主役 UI に</b>＝「精度・計測」の信頼演出（digital パターン隣接）。<br>
    プログレスリング（SVG・round cap・中央%）／ミニバー（1本だけ .hot=accent）／ステータスチップ。<br>
    これが product-UI の <b>signature</b>。写真の代わりにデータが熱量を作る。
  </div>
</body></html>
