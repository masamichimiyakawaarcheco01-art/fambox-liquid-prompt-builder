<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0E1116;--panel:#171B22;--panel2:#1F242C;--line:#2A3038;--ink:#F2F4F7;--muted:#8B939E;--accent:#FB4C15}
  *{margin:0;box-sizing:border-box;font-family:'Inter',-apple-system,system-ui,sans-serif}
  body{background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  header h1 b{color:var(--accent)}
  .keytag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .keytag.ok{color:#10B981;border-color:#10B98155}
  main{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
  .left{border-right:1px solid var(--line);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
  .right{display:flex;flex-direction:column;min-height:0}
  .label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .patterns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
  .pat:hover{border-color:var(--muted)}
  .pat.on{border-color:var(--accent);background:#FB4C1510}
  .pat.off{opacity:.4;cursor:not-allowed}
  .pat .nm{font-weight:600;font-size:14px}
  .pat .tg{font-size:11px;color:var(--muted);margin-top:2px}
  textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font-size:14px;resize:vertical;min-height:90px}
  select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;font-size:13px}
  .btn{border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .toolbar .grow{flex:1}
  .preview-wrap{flex:1;min-height:0;background:#0a0c10;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
  iframe{width:100%;height:100%;border:none;background:#fff;border-radius:10px}
  .empty{color:var(--muted);font-size:14px;text-align:center;max-width:360px;line-height:1.7}
  .banner{background:#FB4C1518;border:1px solid #FB4C1540;color:#FDB89E;font-size:12.5px;padding:10px 14px;border-radius:10px;line-height:1.6}
  .fb{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fb input[type=text]{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 12px;font-size:13px}
  .modes{display:flex;gap:8px}
  .mode{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:13px;font-weight:600}
  .mode small{display:block;font-weight:400;color:var(--muted);font-size:10px;margin-top:2px}
  .mode.on{border-color:var(--accent);background:#FB4C1510}
  .chatbar{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center}
  .chatbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:9px 12px;font-size:13px}
  .stars span{cursor:pointer;font-size:18px;color:#3A424C}
  .stars span.on{color:var(--accent)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  small.hint{color:var(--muted);font-size:11px}
</style></head>
<body>
  <header>
    <h1>Design <b>Wheel</b></h1>
    <span class="keytag" id="keytag">…</span>
  </header>
  <main>
    <div class="left">
      <div>
        <div class="label">1. パターンを選ぶ</div>
        <div class="patterns" id="patterns"></div>
      </div>
      <div>
        <div class="label">2. 形態</div>
        <div class="modes" id="modes">
          <div class="mode on" data-mode="page">Webページ<small>縦長LP</small></div>
          <div class="mode" data-mode="banner">バナー1枚<small>選んだサイズちょうど</small></div>
          <div class="mode" data-mode="flyer">チラシ<small>A4縦・PDF可</small></div>
        </div>
      </div>
      <div>
        <div class="label">3. 何を作る？</div>
        <textarea id="prompt" placeholder="例: 架空のジム「PULSE」のLPを作って。ダークでデータUI風に。"></textarea>
      </div>
      <div>
        <div class="label">4. サイズ（バナー時＝この比率ちょうど／ページ時＝書き出し枠）</div>
        <select id="size"></select>
      </div>
      <button class="btn btn-primary" id="gen">叩き台を生成</button>
      <div class="banner" id="keyhint" style="display:none">
        ⚠️ 生成には Anthropic API キーが必要です。<code>.env</code> に <code>ANTHROPIC_API_KEY=...</code> を設定し再起動してください。設定前でも、プレビュー枠の確認・書き出し・フィードバックは使えます。
      </div>
    </div>
    <div class="right">
      <div class="toolbar">
        <span class="label" style="margin:0">プレビュー</span>
        <span class="grow"></span>
        <button class="btn btn-ghost" id="exportPdf" disabled style="display:none">PDF書き出し</button>
        <button class="btn btn-ghost" id="export" disabled>PNG書き出し</button>
      </div>
      <div class="preview-wrap">
        <div class="empty" id="empty">左でパターンと作りたいものを入力して「叩き台を生成」を押すと、ここに完成形が表示されます。</div>
        <iframe id="frame" style="display:none"></iframe>
      </div>
      <div class="chatbar" id="chatbar" style="display:none">
        <span class="label" style="margin:0">修正指示</span>
        <input type="text" id="revise" placeholder="例: 見出しをもっと大きく / CTAを緑に / 写真を差し替えて">
        <button class="btn btn-ghost" id="reviseBtn">この案を直す</button>
      </div>
      <div class="fb">
        <span class="label" style="margin:0">使ってどうだった？</span>
        <span class="stars" id="stars"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></span>
        <input type="text" id="hard" placeholder="困った点・物足りない点（1行）">
        <button class="btn btn-ghost" id="sendfb">記録</button>
      </div>
    </div>
  </main>
<script src="app.js"></script>
</body></html>
